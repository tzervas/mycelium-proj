[package]
name = "mycelium-proj"
version.workspace = true
description = "Project-metadata layer (M-359; DN-06 §6; KC-3 — above the kernel): the structured nodule header (`// @key: value`), the `mycelium-proj.toml` manifest (a minimal, dependency-free TOML-subset reader), and the EXPLAIN-able top-down inheritance resolver. Metadata is not identity (ADR-003); unknown keys / bad SPDX / non-ISO dates are explicit errors (G2)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Reuses the L1 `// nodule:` marker recogniser (M-358); the structured header layers on top of it.
mycelium-l1 = { git = "https://github.com/tzervas/mycelium-l1", rev = "31f7aaa956cca0e1c7a894eeaff4d10d58b5b2b8" }
# The `CertMode` type (M-786) the `@certification` attribute resolves to (RFC-0034 §6; M-790). proj
# already depends transitively on core via l1, so this introduces no new dependency cycle.
mycelium-core = { git = "https://github.com/tzervas/mycelium-core", rev = "46d2515cbd86d2ae4d1365f4adcd2796737e9f0b" }

[dev-dependencies]
# Property-based testing for the resolution-precedence + cross-mode-boundary laws (M-790; RFC-0034 §6).
proptest = "1"

# --- standalone workspace root (course-correction Phase B, 2026-07-18; steer handoff §6.2) ---
[workspace]

[workspace.package]
version = "0.464.0"
edition = "2021"
rust-version = "1.96.1"
license = "MIT"
repository = "https://github.com/tzervas/mycelium-proj"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[workspace.lints.rust]
# ADR-014: unsafe permitted-but-documented; the check is clippy::undocumented_unsafe_blocks.
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# G2 never-silent arithmetic: release builds panic on overflow (monorepo parity).
[profile.release]
overflow-checks = true
